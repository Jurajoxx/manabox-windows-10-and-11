name: Release

# Pushing a tag such as v1.0.0 builds the app and publishes ManaBoxCompanion.exe as a GitHub Release.
# The big download button in the README always points at the latest release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Keep the build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManaBoxCompanion
          path: dist/ManaBoxCompanion.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/ManaBoxCompanion.exe --clobber --repo '${{ github.repository }}'
          } else {
            gh release create $tag dist/ManaBoxCompanion.exe --repo '${{ github.repository }}' --title "ManaBox Companion $tag" --notes "Download **ManaBoxCompanion.exe** below and run it. Nothing to install. Windows 10 and 11."
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed." }
